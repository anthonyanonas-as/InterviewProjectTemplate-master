<div style="max-width: 900px; margin: 40px auto; font-family: system-ui, sans-serif; padding: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px;">
    <h2>System Admin Log View</h2>
    <span style="background: #333; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 12px;">🔒 Admin Panel</span>
  </div>

  <p style="color: #666;">Displaying all entries sorted with the most recent first.</p>

  <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
    <thead>
      <tr style="background-color: #f4f4f4; text-align: left; border-bottom: 2px solid #ddd;">
        <th style="padding: 12px;">Timestamp</th>
        <th style="padding: 12px;">User Tracking IP</th>
        <th style="padding: 12px;">Logged Mood</th>
        <th style="padding: 12px;">User Comment</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let entry of adminLogs" style="border-bottom: 1px solid #ddd;">
        <td style="padding: 12px; white-space: nowrap;">{{ entry.createdAt | date:'medium' }}</td>
        <td style="padding: 12px; font-family: monospace; color: #555;">{{ entry.ipAddress }}</td>
        <td style="padding: 12px;">
          <span [ngStyle]="{
            'padding': '4px 8px',
            'border-radius': '12px',
            'font-weight': 'bold',
            'font-size': '13px',
            'background-color': 
              entry.mood === 'Feeling great' ? '#d4edda' :
              entry.mood === 'Pretty good' ? '#cce5ff' :
              entry.mood === 'A bit “meh”' ? '#fff3cd' : '#f8d7da',
            'color': 
              entry.mood === 'Feeling great' ? '#155724' :
              entry.mood === 'Pretty good' ? '#004085' :
              entry.mood === 'A bit “meh”' ? '#856404' : '#721c24'
          }">
            {{ entry.mood }}
          </span>
        </td>
        <td style="padding: 12px; color: #333; font-style: italic;">
          {{ entry.note ? entry.note : '—' }}
        </td>
      </tr>
      <tr *ngIf="adminLogs.length === 0">
        <td colspan="4" style="text-align: center; padding: 30px; color: #999;">No mood entries recorded yet.</td>
      </tr>
    </tbody>
  </table>
</div>
